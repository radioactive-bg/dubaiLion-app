name: CI/CD for DubaiLion Main & Staging

on:
  push:
    branches:
      - main
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: hub.radioactive.ac
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set environment variables for branch
        id: set-vars
        run: |
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "IMAGE_TAG=main" >> $GITHUB_ENV
            echo "WEBHOOK_URL=https://5.181.83.200:9443/api/stacks/webhooks/5a4dad6b-08f8-48f9-8982-70829262d9c9" >> $GITHUB_ENV
          elif [ "${GITHUB_REF##*/}" = "staging" ]; then
            echo "IMAGE_TAG=staging" >> $GITHUB_ENV
            echo "WEBHOOK_URL=https://5.181.83.200:9443/api/stacks/webhooks/cdcc2fbf-9505-4411-92a7-1243a5da5f63" >> $GITHUB_ENV
          fi

      - name: Build and Push Docker Image
        run: |
          docker build -t hub.radioactive.ac/radioactive/dubailion-app:${{ env.IMAGE_TAG }} .
          docker push hub.radioactive.ac/radioactive/dubailion-app:${{ env.IMAGE_TAG }}

      - name: Trigger Portainer Webhook
        run: |
          if [ -n "${{ env.WEBHOOK_URL }}" ]; then
            curl -k -X POST "${{ env.WEBHOOK_URL }}"
          else
            echo "Error: WEBHOOK_URL is not set"
            exit 1
          fi
        env:
          CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
